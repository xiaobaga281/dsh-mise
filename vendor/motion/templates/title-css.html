<!doctype html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=1920, height=1080">
<style>
/* Template: a title page driven entirely by CSS keyframes.
   The film host freezes every animation at currentTime = t before the page's
   frame is drawn, so a CSS animation is a deterministic function of t — no
   frame(t) loop is needed. The page's own film object says how long it is.
   Copy this file, rename the class, change the words and the timings. */
html, body { margin: 0; background: #0e0c0a; overflow: hidden; }
.stage {
  position: absolute; inset: 0;
  display: flex; flex-direction: column; align-items: center; justify-content: center;
  gap: 28px;
}
.title {
  font: 700 120px/1.1 "Source Han Sans SC", "Microsoft YaHei", sans-serif;
  color: #f3ead8;
  letter-spacing: 0.06em;
  opacity: 0;
  animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.15s forwards;
}
.sub {
  font: 400 34px/1.4 "Source Han Sans SC", "Microsoft YaHei", sans-serif;
  color: #b9a88e;
  opacity: 0;
  animation: rise 0.9s cubic-bezier(0.16, 1, 0.3, 1) 0.5s forwards;
}
.rule {
  width: 0; height: 3px; background: #c76b3f;
  animation: draw 0.8s ease-out 0.9s forwards;
}
@keyframes rise { from { opacity: 0; transform: translateY(28px); } to { opacity: 1; transform: none; } }
@keyframes draw { to { width: 240px; } }
</style>
</head>
<body>
<div class="stage">
  <div class="title">标题在这里</div>
  <div class="rule"></div>
  <div class="sub">副标题 · 日期 · 一句说明</div>
</div>
<script>
// A page states its own length. The host drives t; the timeline reads this.
window.film = {
  duration: 3.5,
  frame(t) {
    // Nothing to do per-frame: the CSS above is the whole move. This hook
    // exists so the page is a film page, and for the one thing CSS cannot do —
    // holding the last frame exactly (the animations are `forwards`, so this
    // page is already still after 1.7s).
    return t;
  },
};
</script>
</body>
</html>
